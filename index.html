<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Spotify Namorados</title>

        <link rel="stylesheet" href="style.css" />

        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
        />

        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1&icon_names=play_circle,shuffle,skip_next,skip_previous"
            rel="stylesheet"
        />
    </head>
    <body>
        <header>
            <div class="albumImage">
                <img src="assets/img/albumImage.webp" alt="" />
            </div>
            <div class="albumHeader">
                <h1>ALBUM NAME</h1>
                <div class="albumControls">
                    <span class="material-symbols-outlined"> shuffle </span>
                    <span
                        class="material-symbols-outlined"
                        style="font-variation-settings: &quot;FILL&quot; 1"
                    >
                        play_circle
                    </span>
                </div>
            </div>
        </header>

        <main>
            <div class="musicas">
                <div class="titleMusics"><h2>Músicas</h2></div>

                <div class="musicList">
                    <ul>
                        <li>
                            <span class="musicNumber">1</span>
                            <img src="assets/img/music_1.webp" alt="">
                            <div class="musicInfo">
                                <h3 class="musicTitle">Music Title</h3>
                                <p class="musicAuthor">Author</p>
                            </div>
                            <span class="musicTime">03:00</span>
                        </li>
                    </ul>
                </div>
            </div>

        </main>

        <footer>
            
        </footer>

        <script src="js/script.js"></script>
    </body>
</html>
