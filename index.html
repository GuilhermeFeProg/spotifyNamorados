<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Spotify Namorados</title>

        <link rel="stylesheet" href="style.css" />

        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
        />

        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0"
            rel="stylesheet"
        />
    </head>
    <body>
        <header>
            <div class="albumImage">
                <img src="assets/img/albumImage.webp" alt="" />
            </div>
            <div class="albumHeader">
                <h1>ALBUM NAME</h1>
                <div class="albumControls">
                    <span class="material-symbols-outlined" id="shuffleHeader">
                        shuffle
                    </span>
                    <span class="material-symbols-outlined" id="playHeader">
                        play_circle
                    </span>
                </div>
            </div>
        </header>

        <main>
            <div class="musicas">
                <div class="titleMusics"><h2>Músicas</h2></div>

                <div class="musicList">
                    <ul>
                        <li class="music">
                            <span class="musicNumber">1</span>
                            <img src="assets/img/music_1.webp" alt="" />
                            <div class="musicInfo">
                                <h3 class="musicTitle">Music Title</h3>
                                <p class="musicAuthor">Author</p>
                            </div>
                            <span class="musicTime">03:00</span>
                        </li>
                    </ul>
                </div>
            </div>
        </main>

        <footer>
            <div class="songPreview">
                <img src="assets/img/music_1.webp" alt="" />
                <div class="musicInfo">
                    <h3 class="musicTitle">Music Title</h3>
                    <p class="musicAuthor">Author</p>
                </div>
            </div>

            <div class="controlsAndProgressbar">
                <div class="controls">
                    <span class="material-symbols-outlined"> shuffle </span>
                    <span class="material-symbols-outlined">
                        skip_previous
                    </span>
                    <span class="material-symbols-outlined"> play_circle </span>
                    <span class="material-symbols-outlined"> skip_next </span>
                </div>

                <div class="bar">
                    <span id="currentTime">0:00</span>
                    <div class="progressbar">
                        <div class="progress-fill" id="progressFill"></div>
                        <div class="barThumb" id="batThumb"></div>
                    </div>
                    <span id="duration">0:00</span>
                </div>

                <div class="volumeControl">
                    <button id="muteBtn">
                        <span class="material-symbols-outlined">volume_up</span>
                    </button>
                    <div class="volTrack">
                        <div id="volumeFill"></div>
                        <div id="volumeThumb"></div>
                    </div>
                    <span id="volPct">100%</span>
                </div>
            </div>
        </footer>

        <script src="js/script.js"></script>
    </body>
</html>
